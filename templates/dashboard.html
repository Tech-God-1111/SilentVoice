<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentVoice - Sign Language Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            color: white;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
            text-align: center;
        }

        .header h1 { font-size: 2rem; }
        .header p { opacity: 0.9; margin-top: 5px; }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn-start { background: #2ecc71; color: white; }
        .btn-stop { background: #e74c3c; color: white; }
        .btn-clear { background: #f39c12; color: white; }

        .status-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
        }

        .status-active { background: #2ecc71; color: white; }
        .status-inactive { background: #7f8c8d; color: white; }

        .video-container {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 16/9;
            margin-bottom: 20px;
        }

        .video-container img { width: 100%; height: 100%; object-fit: cover; }

        .gesture-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .current-gesture { font-size: 4rem; margin: 15px 0; }
        .current-message { font-size: 1.5rem; padding: 15px; border-radius: 10px; margin: 10px 0; }

        .gesture-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .gesture-item {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .gesture-icon { font-size: 1.5rem; }
        .gesture-message { font-size: 0.75rem; margin-top: 5px; opacity: 0.8; }

        .history-list { max-height: 300px; overflow-y: auto; }
        .history-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
        }

        .stats { display: flex; justify-content: space-around; margin-top: 15px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #667eea; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .emergency { animation: pulse 0.5s infinite; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖐️ SilentVoice</h1>
        <p>Sign Language Assistant | ML-Powered Gesture Recognition</p>
    </div>

    <div class="container">
        <div class="controls">
            <button class="btn btn-start" onclick="startCamera()">▶ START CAMERA</button>
            <button class="btn btn-stop" onclick="stopCamera()">⏹ STOP CAMERA</button>
            <button class="btn btn-clear" onclick="clearHistory()">🗑 CLEAR HISTORY</button>
        </div>

        <div class="status-card">
            <span id="statusBadge" class="status-badge status-inactive">● CAMERA OFF</span>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="totalGestures">0</div>
                    <div>Messages Sent</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="currentFingers">0</div>
                    <div>Current Gesture</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="modelStatus">-</div>
                    <div>ML Model</div>
                </div>
            </div>
        </div>

        <div class="video-container">
            <img id="videoFeed" src="{{ url_for('video_feed') }}" alt="Camera Feed">
        </div>

        <div class="gesture-card">
            <h3>🎯 Current Gesture</h3>
            <div class="current-gesture" id="currentGesture">✋</div>
            <div class="current-message" id="currentMessage" style="background: #3498db">
                Camera Off - Press Start
            </div>
            <button class="btn btn-start" onclick="repeatMessage()" style="background:#3498db">🔊 Repeat Message</button>
        </div>

        <div class="gesture-card">
            <h3>📖 Gesture Guide</h3>
            <div class="gesture-grid" id="gestureGrid"></div>
        </div>

        <div class="gesture-card">
            <h3>📝 Message History</h3>
            <div class="history-list" id="historyList">
                <div style="text-align: center; opacity: 0.5;">No messages yet</div>
            </div>
        </div>
    </div>

    <script>
        const gestures = {{ gestures|tojson }};
        let lastGesture = null;

        function buildGestureGrid() {
            const grid = document.getElementById('gestureGrid');
            grid.innerHTML = '';
            for (const [fingers, info] of Object.entries(gestures)) {
                grid.innerHTML += `
                    <div class="gesture-item" style="border-left: 4px solid ${info.color}">
                        <div class="gesture-icon">${info.icon || '✋'}</div>
                        <div class="gesture-message">${info.short}</div>
                    </div>
                `;
            }
        }

        function startCamera() {
            fetch('/api/start', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('statusBadge').className = 'status-badge status-active';
                        document.getElementById('statusBadge').innerHTML = '● CAMERA ACTIVE';
                    }
                });
        }

        function stopCamera() {
            fetch('/api/stop', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('statusBadge').className = 'status-badge status-inactive';
                        document.getElementById('statusBadge').innerHTML = '● CAMERA OFF';
                        document.getElementById('currentGesture').innerHTML = '✋';
                        document.getElementById('currentMessage').innerHTML = 'Camera Off - Press Start';
                        document.getElementById('currentMessage').style.background = '#3498db';
                        document.getElementById('currentFingers').innerHTML = '0';
                        document.getElementById('currentMessage').classList.remove('emergency');
                    }
                });
        }

        function updateGesture() {
            fetch('/api/gesture')
                .then(r => r.json())
                .then(data => {
                    if (data.active) {
                        const icons = {0:'✊',1:'☝️',2:'✌️',3:'🤟',4:'🖖',5:'🖐️'};
                        document.getElementById('currentGesture').innerHTML = icons[data.fingers] || '✋';
                        document.getElementById('currentMessage').innerHTML = data.message;
                        document.getElementById('currentMessage').style.background = data.color;
                        document.getElementById('currentFingers').innerHTML = data.fingers;

                        if (data.fingers === 5) {
                            document.getElementById('currentMessage').classList.add('emergency');
                        } else {
                            document.getElementById('currentMessage').classList.remove('emergency');
                        }
                        lastGesture = data;
                    }
                });
        }

        function updateHistory() {
            fetch('/api/history')
                .then(r => r.json())
                .then(data => {
                    const container = document.getElementById('historyList');
                    if (data.length === 0) {
                        container.innerHTML = '<div style="text-align: center; opacity: 0.5;">No messages yet</div>';
                        return;
                    }
                    container.innerHTML = data.map(item => `
                        <div class="history-item">
                            <span>${item.timestamp}</span>
                            <span>${'✋'.repeat(item.fingers)}</span>
                            <span>${item.message.substring(0, 30)}</span>
                        </div>
                    `).join('');
                    document.getElementById('totalGestures').innerHTML = data.length;
                });
        }

        function updateStats() {
            fetch('/api/stats')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('modelStatus').innerHTML = data.model_loaded ? '✅ Active' : '❌ No Model';
                });
        }

        function repeatMessage() {
            if (lastGesture && lastGesture.message && lastGesture.active) {
                fetch('/api/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: lastGesture.message })
                });
            }
        }

        function clearHistory() {
            if (confirm('Clear all message history?')) {
                fetch('/api/clear_history', { method: 'POST' })
                    .then(() => { updateHistory(); updateStats(); });
            }
        }

        buildGestureGrid();
        setInterval(updateGesture, 200);
        setInterval(updateHistory, 1000);
        setInterval(updateStats, 3000);
        updateGesture();
        updateHistory();
    </script>
</body>
</html>
